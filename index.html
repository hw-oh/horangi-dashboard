const SC={XS:"#B8A9E8",S:"#6BAED6",M:"#F0A040",L:"#E05040",API:"#A8A8A8"};
const SR={XS:3.5,S:4.5,M:5.5,L:7,API:5};
const REFS=[
  {p:"gemini-3.1-pro",dx:6,dy:-5},{p:"gemini-3-flash",dx:-6,dy:-5},
  {p:"gemini-3.1-flash-lite",dx:-6,dy:12},{p:"claude-opus-4-6",dx:6,dy:-5},
  {p:"claude-sonnet-4-6",dx:6,dy:12},{p:"claude-haiku-4-5",dx:-6,dy:-5},
  {p:"gpt-5.4",dx:6,dy:12,exact:true},{p:"gpt-5.4-mini",dx:6,dy:-5},

  {p:"gemma-4-31B-it",dx:-6,dy:-5},{p:"gemma-4-26B-A4B-it",dx:-6,dy:-5},
  {p:"gemma-4-E4B-it",dx:-6,dy:12},{p:"gemma-4-E2B-it",dx:-6,dy:12},
];
const matchRef=function(m){return REFS.some(function(r){return r.exact?m.n===r.p:m.n.startsWith(r.p)})};
const findRef=function(m){return REFS.find(function(r){return r.exact?m.n===r.p:m.n.startsWith(r.p)})};
const FC={"Gemini":"#1a7a3a","Claude":"#7B52D4","GPT":"#C85030","Gemma 4":"#E08820","Gemma 3":"#C8A060","Qwen 3.5/3.6":"#B07818","Qwen 3":"#C8A040","GLM":"#D04878","DeepSeek":"#2070A8","Grok":"#58A038","Kimi":"#8050C0","MiMo":"#C06080","MiniMax":"#A068A0","EXAONE":"#3888B8","Solar":"#D06828","HyperCLOVA":"#28A070","A.X":"#7060C0","VAETKI":"#808080","Kanana":"#B09038","Mi:dm":"#6898A8"};

const W=720,H=680,P={t:16,r:16,b:44,l:44};
const pw=W-P.l-P.r,ph=H-P.t-P.b;
const xMn=10,xMx=90,yMn=26,yMx=92;
const sx=function(g){return(g-xMn)/(xMx-xMn)*pw+P.l};
const sy=function(a){return H-P.b-(a-yMn)/(yMx-yMn)*ph};
function getTier(f){
  if(f>=75)return{l:"Frontier",c:"#1a7a3a"};
  if(f>=65)return{l:"Strong",c:"#2563a8"};
  if(f>=55)return{l:"Competitive",c:"#a07018"};
  return{l:"Emerging",c:"#888"};
}

function App(){
  const[selFams,setSelFams]=useState(new Set());
  const[hov,setHov]=useState(null);
  const[activeModels,setActiveModels]=useState(new Set());
  const[showReg,setShowReg]=useState(true);

  var hasSel=selFams.size>0;

  var selectFamily=function(name){
    setSelFams(function(prev){
      var next=new Set(prev);
      if(next.has(name)){
        next.delete(name);
        setActiveModels(function(am){
          var nm=new Set(am);
          DATA.forEach(function(m){if(m.fam===name)nm.delete(m.n)});
          return nm;
        });
      }else{
        next.add(name);
        setActiveModels(function(am){
          var nm=new Set(am);
          DATA.forEach(function(m){if(m.fam===name)nm.add(m.n)});
          return nm;
        });
      }
      return next;
    });
  };
  var toggleModel=function(name){
    setActiveModels(function(prev){
      var next=new Set(prev);
      if(next.has(name))next.delete(name);else next.add(name);
      return next;
    });
  };

  var fams=useMemo(function(){
    var m={};
    DATA.forEach(function(d){if(!m[d.fam])m[d.fam]={cnt:0,best:0,ms:[]};m[d.fam].cnt++;m[d.fam].best=Math.max(m[d.fam].best,d.f);m[d.fam].ms.push(d);});
    Object.values(m).forEach(function(v){v.ms.sort(function(a,b){return b.f-a.f})});
    return Object.entries(m).sort(function(a,b){return b[1].best-a[1].best}).map(function(e){return{name:e[0],cnt:e[1].cnt,best:e[1].best,ms:e[1].ms}});
  },[]);

  var isHL=function(m){return hasSel&&selFams.has(m.fam)&&activeModels.has(m.n)};

  var sorted=useMemo(function(){
    return DATA.slice().sort(function(a,b){
      var aH=hasSel&&selFams.has(a.fam)&&activeModels.has(a.n)?1:0;
      var bH=hasSel&&selFams.has(b.fam)&&activeModels.has(b.n)?1:0;
      if(aH!==bH)return aH-bH;
      return a.f-b.f;
    });
  },[selFams,activeModels,hasSel]);

  var labels=useMemo(function(){
    var out=[];
    if(hasSel){
      DATA.filter(function(m){return selFams.has(m.fam)&&activeModels.has(m.n)}).forEach(function(m){
        var r=findRef(m);
        out.push({m:m,dx:r?r.dx:(m.g>60?-8:8),dy:r?r.dy:(m.a>70?12:-6),hl:true});
      });
      DATA.filter(function(m){return !selFams.has(m.fam)&&matchRef(m)}).forEach(function(m){
        var r=findRef(m);out.push({m:m,dx:r.dx,dy:r.dy,hl:false});
      });
    } else {
      DATA.filter(matchRef).forEach(function(m){var r=findRef(m);out.push({m:m,dx:r.dx,dy:r.dy,hl:false});});
    }
    return out;
  },[selFams,activeModels,hasSel]);

  var tierPolys=useMemo(function(){
    var fills=[{th:75,prev:100,c:"rgba(160,210,150,0.3)"},{th:65,prev:75,c:"rgba(150,190,230,0.3)"},{th:55,prev:65,c:"rgba(235,215,140,0.3)"}];
    return fills.map(function(f,i){
      var pts="";
      for(var x=xMn;x<=xMx;x+=0.5){var y=Math.min(Math.max(2*f.prev-x,yMn),yMx);pts+=sx(x)+","+sy(y)+" ";}
      for(var x2=xMx;x2>=xMn;x2-=0.5){var y2=Math.min(Math.max(2*f.th-x2,yMn),yMx);pts+=sx(x2)+","+sy(y2)+" ";}
      return h("polygon",{key:i,points:pts,fill:f.c});
    });
  },[]);

  var isDark=typeof window!=='undefined'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
  var bg=isDark?"#2c2c2a":"#ffffff";
  var border=isDark?"#555":"#ddd";
  var txt=isDark?"#e8e6e0":"#1a1a1a";
  var txt2=isDark?"#aaa":"#777";
  var txt3=isDark?"#777":"#aaa";
  var bgSec=isDark?"#333":"#f5f5f3";
  var borderLight=isDark?"rgba(255,255,255,0.1)":"rgba(0,0,0,0.08)";
  var borderMed=isDark?"rgba(255,255,255,0.15)":"rgba(0,0,0,0.12)";

  var regression=useMemo(function(){
    var n=DATA.length;
    if(n<2)return null;
    var sX=0,sY=0,sXY=0,sX2=0;
    DATA.forEach(function(m){sX+=m.g;sY+=m.a;sXY+=m.g*m.a;sX2+=m.g*m.g;});
    var denom=n*sX2-sX*sX;
    if(Math.abs(denom)<1e-10)return null;
    var slope=(n*sXY-sX*sY)/denom;
    var intercept=(sY-slope*sX)/n;
    return{slope:slope,intercept:intercept};
  },[]);

  var selFamData=hasSel?fams.filter(function(x){return selFams.has(x.name)}):[];

  var tierLines=[75,65,55].map(function(th,i){
    var pts="";for(var x=xMn;x<=xMx;x+=1){var y=2*th-x;if(y>=yMn&&y<=yMx)pts+=sx(x)+","+sy(y)+" ";}
    return h("polyline",{key:i,points:pts,fill:"none",stroke:borderMed,strokeWidth:0.8,strokeDasharray:"5,4"});
  });

  var axisTxt=isDark?"#e8e6e0":"#1a1a1a";
  var xTicks=[20,30,40,50,60,70,80].filter(function(v){return v>=xMn&&v<=xMx}).map(function(v){
    return h("g",{key:"x"+v},
      h("line",{x1:sx(v),y1:H-P.b,x2:sx(v),y2:P.t,stroke:borderLight,strokeWidth:0.3}),
      h("text",{x:sx(v),y:H-P.b+14,textAnchor:"middle",fontSize:10,fill:axisTxt},v)
    );
  });
  var yTicks=[30,40,50,60,70,80,90].filter(function(v){return v>=yMn&&v<=yMx}).map(function(v){
    return h("g",{key:"y"+v},
      h("line",{x1:P.l,y1:sy(v),x2:W-P.r,y2:sy(v),stroke:borderLight,strokeWidth:0.3}),
      h("text",{x:P.l-6,y:sy(v)+3.5,textAnchor:"end",fontSize:10,fill:axisTxt},v)
    );
  });

  var dots=sorted.map(function(m,i){
    var hl=isHL(m);
    var op=hasSel?(hl?0.9:0.25):0.6;
    var r=SR[m.s]*(hl?1.8:1);
    return h("circle",{key:i,cx:sx(m.g),cy:sy(m.a),r:r,
      fill:SC[m.s],fillOpacity:op,
      stroke:hl?"#111":"rgba(255,255,255,0.5)",strokeWidth:hl?2.2:0.4,
      style:{cursor:"pointer"},
      onMouseEnter:function(){setHov(m)},onMouseLeave:function(){setHov(null)},
      onClick:function(){selectFamily(m.fam)}
    });
  });

  var labelEls=labels.map(function(lb,i){
    return h("text",{key:"lb"+i,x:sx(lb.m.g)+lb.dx,y:sy(lb.m.a)+lb.dy,
      fontSize:lb.hl?10.5:8.5,fontWeight:lb.hl?600:400,
      fill:lb.hl?txt:txt2,opacity:lb.hl?1:0.6,
      textAnchor:lb.dx<0?"end":"start",style:{pointerEvents:"none"}
    },lb.m.n);
  });

  var tooltip=null;
  if(hov){
    var bx=Math.min(Math.max(sx(hov.g)+14,4),W-192);
    var by=Math.max(sy(hov.a)-56,4);
    var t=getTier(hov.f);
    tooltip=h("g",{style:{pointerEvents:"none"}},
      h("rect",{x:bx,y:by,width:184,height:50,rx:8,fill:bg,stroke:border,strokeWidth:0.5}),
      h("text",{x:bx+10,y:by+16,fontSize:11.5,fontWeight:600,fill:txt},hov.n),
      h("text",{x:bx+10,y:by+30,fontSize:10,fill:txt2},"FINAL "+hov.f+" \u00b7 GLP "+hov.g+" \u00b7 ALT "+hov.a),
      h("text",{x:bx+10,y:by+42,fontSize:10,fill:t.c},t.l+" \u00b7 "+hov.s+" \u00b7 "+hov.fam)
    );
  }

  var famButtons=fams.map(function(f){
    var on=selFams.has(f.name);
    return h("button",{key:f.name,onClick:function(){selectFamily(f.name)},
      style:{padding:"5px 14px",borderRadius:99,fontSize:12,fontWeight:on?600:400,cursor:"pointer",border:"none",
        background:on?(FC[f.name]||"#888"):bgSec,color:on?"#fff":txt2}
    },f.name);
  });

  var modelChips=null;
  if(selFamData.length>0){
    var groups=selFamData.map(function(sf){
      var chips=sf.ms.map(function(m){
        var on=activeModels.has(m.n);
        var t=getTier(m.f);
        return h("button",{key:m.n,onClick:function(){toggleModel(m.n)},
          onMouseEnter:function(){setHov(m)},onMouseLeave:function(){setHov(null)},
          style:{display:"flex",alignItems:"center",gap:6,padding:"6px 12px",borderRadius:8,cursor:"pointer",
            border:on?"1.5px solid "+(FC[sf.name]||"#888"):"1.5px solid "+borderMed,
            background:on?bg:"transparent",opacity:on?1:0.4}
        },
          h("div",{style:{width:7,height:7,borderRadius:"50%",background:SC[m.s],flexShrink:0}}),
          h("span",{style:{fontSize:12,color:txt,whiteSpace:"nowrap"}},m.n),
          h("span",{style:{fontSize:12,fontWeight:600,color:t.c,fontVariantNumeric:"tabular-nums"}},m.f)
        );
      });
      return h("div",{key:sf.name,style:{marginBottom:selFamData.length>1?10:0}},
        h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:8}},
          h("div",{style:{width:10,height:10,borderRadius:"50%",background:FC[sf.name]||"#888"}}),
          h("span",{style:{fontSize:14,fontWeight:600,color:txt}},sf.name),
          h("span",{style:{fontSize:12,color:txt3}},sf.cnt+" models")
        ),
        h("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},chips)
      );
    });
    modelChips=h("div",{style:{marginTop:16,padding:"12px 16px",borderRadius:12,background:bgSec}},groups);
  }

  var downloadPng=function(){
    var svgEl=window.__svgEl;if(!svgEl)return;
    var clone=svgEl.cloneNode(true);
    clone.setAttribute("width",W*2);clone.setAttribute("height",H*2);
    clone.removeAttribute("style");
    var bgRect=document.createElementNS("http://www.w3.org/2000/svg","rect");
    bgRect.setAttribute("width",W);bgRect.setAttribute("height",H);
    bgRect.setAttribute("fill",bg);
    clone.insertBefore(bgRect,clone.firstChild);
    var st=document.createElementNS("http://www.w3.org/2000/svg","style");
    st.textContent="text{font-family:system-ui,-apple-system,sans-serif}";
    clone.insertBefore(st,clone.firstChild);
    var svgData=new XMLSerializer().serializeToString(clone);
    var img=new Image();
    var canvas=document.createElement("canvas");
    canvas.width=W*2;canvas.height=H*2;
    var ctx=canvas.getContext("2d");
    img.onload=function(){
      ctx.drawImage(img,0,0,W*2,H*2);
      var link=document.createElement("a");
      var fname="horangi-leaderboard";
      if(hasSel)fname+="-"+Array.from(selFams).join("-");
      link.download=fname+".png";
      link.href=canvas.toDataURL("image/png");
      link.click();
    };
    img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svgData);
  };

  return h("div",null,
    h("div",{style:{marginBottom:10,display:"flex",alignItems:"flex-start",justifyContent:"space-between",flexWrap:"wrap",gap:8}},
      h("div",null,
        h("h2",{style:{margin:"0 0 2px",fontSize:17,fontWeight:600,color:txt}},"Horangi Korean LLM Leaderboard"),
        h("span",{style:{fontSize:12,color:txt3}},DATA.length+" models \u00b7 GLP \u00d7 ALT \u00b7 click families to compare")
      ),
      h("div",{style:{display:"flex",gap:6,alignItems:"center"}},
        h("button",{onClick:function(){setShowReg(!showReg)},
          style:{padding:"4px 12px",borderRadius:6,fontSize:11,cursor:"pointer",
            border:"1px solid "+borderMed,background:showReg?(isDark?"#443020":"#fff4e8"):"transparent",
            color:showReg?(isDark?"#f0a040":"#c06030"):txt2}
        },showReg?"\u2713 Regression":"Regression"),
        h("button",{onClick:downloadPng,
          style:{padding:"4px 12px",borderRadius:6,fontSize:11,cursor:"pointer",
            border:"1px solid "+borderMed,background:"transparent",color:txt2}
        },"\u2b07 PNG")
      )
    ),
    h("div",{style:{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}},
      h("button",{onClick:function(){setSelFams(new Set());setActiveModels(new Set())},
        style:{padding:"5px 14px",borderRadius:99,fontSize:12,fontWeight:!hasSel?600:400,cursor:"pointer",border:"none",
          background:!hasSel?txt:bgSec,color:!hasSel?bg:txt2}
      },"All"),
      famButtons
    ),
    h("svg",{ref:function(el){window.__svgEl=el},viewBox:"0 0 "+W+" "+H,style:{width:"100%",maxWidth:720,height:"auto",display:"block"}},
      tierPolys,
      tierLines,
      xTicks,yTicks,
      h("text",{x:W/2,y:H-2,textAnchor:"middle",fontSize:11,fontWeight:500,fill:axisTxt},"GLP (General Language Proficiency) \u2192"),
      h("text",{x:10,y:H/2,textAnchor:"middle",fontSize:11,fontWeight:500,fill:axisTxt,transform:"rotate(-90,10,"+H/2+")"},"ALT (Alignment) \u2192"),
      showReg&&regression?h("line",{
          x1:sx(xMn),y1:sy(regression.slope*xMn+regression.intercept),
          x2:sx(xMx),y2:sy(regression.slope*xMx+regression.intercept),
          stroke:isDark?"rgba(255,180,80,0.5)":"rgba(200,80,40,0.4)",strokeWidth:1.5,strokeDasharray:"6,4"
      }):null,
      dots,labelEls,tooltip,
      h("g",null,
        h("rect",{x:P.l+4,y:P.t+4,width:90,height:68,rx:6,fill:bg,fillOpacity:0.85,stroke:borderMed,strokeWidth:0.5}),
        [{l:"Frontier",c:"rgba(100,180,100,0.6)"},{l:"Strong",c:"rgba(100,160,220,0.6)"},{l:"Competitive",c:"rgba(210,190,80,0.6)"},{l:"Emerging",c:borderMed}].map(function(t,i){
          return h("g",{key:"tl"+i},
            h("rect",{x:P.l+12,y:P.t+12+i*15,width:8,height:8,rx:2,fill:t.c}),
            h("text",{x:P.l+24,y:P.t+19+i*15,fontSize:9.5,fill:txt2},t.l)
          );
        })
      ),
      h("g",null,
        h("rect",{x:W-P.r-74,y:H-P.b-84,width:70,height:84,rx:6,fill:bg,fillOpacity:0.85,stroke:borderMed,strokeWidth:0.5}),
        [{s:"XS",l:"<5B"},{s:"S",l:"5-15B"},{s:"M",l:"15-50B"},{s:"L",l:"50B+"},{s:"API",l:"API"}].map(function(x,i){
          return h("g",{key:"sl"+i},
            h("circle",{cx:W-P.r-60,cy:H-P.b-70+i*15,r:4,fill:SC[x.s],fillOpacity:0.9}),
            h("text",{x:W-P.r-52,y:H-P.b-66+i*15,fontSize:9.5,fill:txt2},x.l)
          );
        })
      )
    ),
    modelChips
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
