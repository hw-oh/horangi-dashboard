  var fams=useMemo(function(){
    var m={};
    DATA.forEach(function(d){if(!m[d.fam])m[d.fam]={cnt:0,best:0,ms:[]};m[d.fam].cnt++;m[d.fam].best=Math.max(m[d.fam].best,d.f);m[d.fam].ms.push(d);});
    Object.values(m).forEach(function(v){v.ms.sort(function(a,b){return b.f-a.f})});
    return Object.entries(m).sort(function(a,b){return b[1].best-a[1].best}).map(function(e){return{name:e[0],cnt:e[1].cnt,best:e[1].best,ms:e[1].ms}});
  },[]);

  var isHL=function(m){return hasSel&&activeModels.has(m.n)};

  var sorted=useMemo(function(){
    return DATA.slice().sort(function(a,b){
      var aH=activeModels.has(a.n)?1:0;
      var bH=activeModels.has(b.n)?1:0;
      if(aH!==bH)return aH-bH;
      return a.f-b.f;
    });
  },[activeModels]);

  var labels=useMemo(function(){
    var out=[];
    if(hasSel){
      DATA.filter(function(m){return activeModels.has(m.n)}).forEach(function(m){
        var r=findRef(m);
        out.push({m:m,dx:r?r.dx:(m.g>60?-8:8),dy:r?r.dy:(m.a>70?12:-6),hl:true});
      });
      DATA.filter(function(m){return !activeModels.has(m.n)&&matchRef(m)}).forEach(function(m){
        var r=findRef(m);out.push({m:m,dx:r.dx,dy:r.dy,hl:false});
      });
    } else {
      DATA.filter(matchRef).forEach(function(m){var r=findRef(m);out.push({m:m,dx:r.dx,dy:r.dy,hl:false});});
    }
    return out;
  },[activeModels,hasSel]);

  var tierPolys=useMemo(function(){
    var fills=[{th:75,prev:100,c:"rgba(160,210,150,0.3)"},{th:65,prev:75,c:"rgba(150,190,230,0.3)"},{th:55,prev:65,c:"rgba(235,215,140,0.3)"}];
    return fills.map(function(f,i){
      var pts="";
      for(var x=xMn;x<=xMx;x+=0.5){var y=Math.min(Math.max(2*f.prev-x,yMn),yMx);pts+=sx(x)+","+sy(y)+" ";}
      for(var x2=xMx;x2>=xMn;x2-=0.5){var y2=Math.min(Math.max(2*f.th-x2,yMn),yMx);pts+=sx(x2)+","+sy(y2)+" ";}
      return h("polygon",{key:i,points:pts,fill:f.c});
    });
  },[]);

  var isDark=typeof window!=='undefined'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
  var bg=isDark?"#2c2c2a":"#ffffff";
  var border=isDark?"#555":"#ddd";
  var txt=isDark?"#e8e6e0":"#1a1a1a";
  var txt2=isDark?"#aaa":"#777";
  var txt3=isDark?"#777":"#aaa";
  var bgSec=isDark?"#333":"#f5f5f3";
  var borderLight=isDark?"rgba(255,255,255,0.1)":"rgba(0,0,0,0.08)";
  var borderMed=isDark?"rgba(255,255,255,0.15)":"rgba(0,0,0,0.12)";

  var regression=useMemo(function(){
    var n=DATA.length;
    if(n<2)return null;
    var sX=0,sY=0,sXY=0,sX2=0;
    DATA.forEach(function(m){sX+=m.g;sY+=m.a;sXY+=m.g*m.a;sX2+=m.g*m.g;});
    var denom=n*sX2-sX*sX;
    if(Math.abs(denom)<1e-10)return null;
    var slope=(n*sXY-sX*sY)/denom;
    var intercept=(sY-slope*sX)/n;
    return{slope:slope,intercept:intercept};
  },[]);

  var selFamData=hasSel?fams.filter(function(f){return f.ms.some(function(m){return activeModels.has(m.n)})}):[];

  var tierLines=[75,65,55].map(function(th,i){
    var pts="";for(var x=xMn;x<=xMx;x+=1){var y=2*th-x;if(y>=yMn&&y<=yMx)pts+=sx(x)+","+sy(y)+" ";}
    return h("polyline",{key:i,points:pts,fill:"none",stroke:borderMed,strokeWidth:0.8,strokeDasharray:"5,4"});
  });

  var axisTxt=isDark?"#e8e6e0":"#1a1a1a";
  var xTicks=[20,30,40,50,60,70,80].filter(function(v){return v>=xMn&&v<=xMx}).map(function(v){
    return h("g",{key:"x"+v},
      h("line",{x1:sx(v),y1:H-P.b,x2:sx(v),y2:P.t,stroke:borderLight,strokeWidth:0.3}),
      h("text",{x:sx(v),y:H-P.b+14,textAnchor:"middle",fontSize:10,fill:axisTxt},v)
    );
  });
  var yTicks=[30,40,50,60,70,80,90].filter(function(v){return v>=yMn&&v<=yMx}).map(function(v){
    return h("g",{key:"y"+v},
      h("line",{x1:P.l,y1:sy(v),x2:W-P.r,y2:sy(v),stroke:borderLight,strokeWidth:0.3}),
      h("text",{x:P.l-6,y:sy(v)+3.5,textAnchor:"end",fontSize:10,fill:axisTxt},v)
    );
  });

  var dots=sorted.map(function(m){
    var hl=isHL(m);
    var isHov=hov&&hov.n===m.n;
    var op=hasSel?(hl?0.9:0.25):0.6;
    if(isHov)op=1;
    var r=SR[m.s]*(hl?1.8:1);
    if(isHov)r=Math.max(r,8);
    return h("circle",{key:m.n,cx:sx(m.g),cy:sy(m.a),r:r,
      fill:isHov?(FC[m.fam]||SC[m.s]):SC[m.s],fillOpacity:op,
      stroke:isHov?"#111":hl?"#111":"rgba(255,255,255,0.5)",strokeWidth:isHov?2.5:hl?2.2:0.4,
      style:{cursor:"pointer"},
      onMouseEnter:function(){setHov(m)},onMouseLeave:function(){setHov(null)},
      onClick:function(){toggleModel(m.n)}
    });
  });

  var labelEls=labels.map(function(lb,i){
    return h("text",{key:"lb"+i,x:sx(lb.m.g)+lb.dx,y:sy(lb.m.a)+lb.dy,
      fontSize:lb.hl?10.5:8.5,fontWeight:lb.hl?600:400,
      fill:lb.hl?txt:txt2,opacity:lb.hl?1:0.6,
      textAnchor:lb.dx<0?"end":"start",style:{pointerEvents:"none"}
    },lb.m.n);
  });

  var tooltip=null;
  if(hov){
    var bx=Math.min(Math.max(sx(hov.g)+14,4),W-192);
    var by=Math.max(sy(hov.a)-56,4);
    var t=getTier(hov.f);
    tooltip=h("g",{style:{pointerEvents:"none"}},
      h("rect",{x:bx,y:by,width:184,height:50,rx:8,fill:bg,stroke:border,strokeWidth:0.5}),
      h("text",{x:bx+10,y:by+16,fontSize:11.5,fontWeight:600,fill:txt},hov.n),
      h("text",{x:bx+10,y:by+30,fontSize:10,fill:txt2},"FINAL "+hov.f+" \u00b7 GLP "+hov.g+" \u00b7 ALT "+hov.a),
      h("text",{x:bx+10,y:by+42,fontSize:10,fill:t.c},t.l+" \u00b7 "+hov.s+" \u00b7 "+hov.fam)
    );
  }

  var famButtons=fams.map(function(f){
    var on=f.ms.some(function(m){return activeModels.has(m.n)});
    return h("button",{key:f.name,onClick:function(){selectFamily(f.name)},
      style:{padding:"3px 10px",borderRadius:99,fontSize:11,fontWeight:on?600:400,cursor:"pointer",border:"none",
        background:on?(FC[f.name]||"#888"):bgSec,color:on?"#fff":txt2}
    },f.name);
  });

  var activeList=DATA.filter(function(m){return activeModels.has(m.n)});

  function RadarChart(props){
    var models=props.models,labels=props.labels,koLabels=props.koLabels,field=props.field,title=props.title;
    var n=labels.length,cx=130,cy=130,R=105;
    var angles=labels.map(function(_,i){return-Math.PI/2+2*Math.PI*i/n});
    var rings=[20,40,60,80,100];
    var gridEls=rings.map(function(v,ri){
      var pts=angles.map(function(a){return(cx+R*v/100*Math.cos(a))+","+(cy+R*v/100*Math.sin(a))}).join(" ");
      return h("polygon",{key:"r"+ri,points:pts,fill:"none",stroke:borderLight,strokeWidth:0.5});
    });
    var axisEls=angles.map(function(a,i){
      return h("g",{key:"a"+i},
        h("line",{x1:cx,y1:cy,x2:cx+R*Math.cos(a),y2:cy+R*Math.sin(a),stroke:borderLight,strokeWidth:0.3}),
        h("text",{x:cx+(R+14)*Math.cos(a),y:cy+(R+14)*Math.sin(a),textAnchor:"middle",dominantBaseline:"middle",fontSize:8.5,fill:txt2},koLabels[i])
      );
    });
    var PALETTE=["#e6194b","#3cb44b","#4363d8","#f58231","#911eb4","#42d4f4","#f032e6","#bfef45","#469990","#dcbeff","#9A6324","#800000","#aaffc3","#808000","#000075","#a9a9a9"];
    var polyEls=models.map(function(m,mi){
      var scores=labels.map(function(k){return(m[field]||{})[k]||0});
      var pts=scores.map(function(v,i){return(cx+R*v/100*Math.cos(angles[i]))+","+(cy+R*v/100*Math.sin(angles[i]))}).join(" ");
      var fc=models.length>1?PALETTE[mi%PALETTE.length]:(FC[m.fam]||"#888");
      return h("polygon",{key:m.n,points:pts,fill:fc,fillOpacity:0.10,stroke:fc,strokeWidth:1.8,strokeOpacity:0.85});
    });
    return h("div",{style:{flex:"1 1 0",minWidth:0,display:"flex",flexDirection:"column",overflow:"hidden"}},
      h("div",{style:{fontSize:11,fontWeight:600,color:txt,marginBottom:2,flexShrink:0}},title),
      h("svg",{viewBox:"0 0 260 260",style:{width:"100%",height:"100%",maxHeight:"100%"}},gridEls,axisEls,polyEls)
    );
  }

  var downloadCsv=function(){
    var csv="\uFEFF";
    csv+="Rank,Model,Family,Size,FINAL,GLP,ALT,"+GLP_KO.join(",")+","+ALT_KO.join(",")+"\n";
    DATA.forEach(function(m,i){
      csv+=(i+1)+',"'+m.n+'",'+m.fam+","+m.s+","+m.f+","+m.g+","+m.a;
      GLP_LABELS.forEach(function(k){csv+=","+(m.gs[k]||0)});
      ALT_LABELS.forEach(function(k){csv+=","+(m.as[k]||0)});
      csv+="\n";
    });
    var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    var link=document.createElement("a");
    link.download="horangi-leaderboard-"+DATA.length+"models.csv";
    link.href=URL.createObjectURL(blob);
    link.click();
  };

  var cs={padding:"3px 5px",fontSize:10,textAlign:"right",fontVariantNumeric:"tabular-nums",whiteSpace:"nowrap"};
  var leaderboardRows=DATA.map(function(m,i){
    var on=activeModels.has(m.n);
    var t=getTier(m.f);
    var glpCells=GLP_LABELS.map(function(k){return h("td",{key:"g"+k,style:Object.assign({},cs,{color:txt3})},(m.gs||{})[k]||"")});
    var altCells=ALT_LABELS.map(function(k){return h("td",{key:"a"+k,style:Object.assign({},cs,{color:txt3})},(m.as||{})[k]||"")});
    return h("tr",{key:m.n,
      onClick:function(){toggleModel(m.n)},
      onMouseEnter:function(){setHov(m)},onMouseLeave:function(){setHov(null)},
      style:{cursor:"pointer",background:on?(isDark?"rgba(255,255,255,0.06)":"rgba(0,0,0,0.03)"):"transparent",
        borderLeft:on?"3px solid "+(FC[m.fam]||"#888"):"3px solid transparent"}
    },
      h("td",{style:{padding:"3px 5px",fontSize:10,color:txt3,textAlign:"right"}},i+1),
      h("td",{style:{padding:"3px 5px",fontSize:10,fontWeight:on?600:400,color:on?txt:txt2,maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},m.n),
      h("td",{style:{padding:"3px 5px",fontSize:10,color:FC[m.fam]||txt2,whiteSpace:"nowrap"}},m.fam),
      h("td",{style:{padding:"3px 5px",textAlign:"center"}},
        h("span",{style:{display:"inline-block",width:6,height:6,borderRadius:"50%",background:SC[m.s]}})),
      h("td",{style:{padding:"3px 5px",fontSize:10.5,textAlign:"right",fontWeight:600,fontVariantNumeric:"tabular-nums",color:t.c}},m.f),
      h("td",{style:Object.assign({},cs,{fontWeight:500,color:txt})},m.g),
      h("td",{style:Object.assign({},cs,{fontWeight:500,color:txt})},m.a),
      glpCells,altCells
    );
  });

  var downloadPng=function(){
    var svgEl=window.__svgEl;if(!svgEl)return;
    var clone=svgEl.cloneNode(true);
    clone.setAttribute("width",W*2);clone.setAttribute("height",H*2);
    clone.removeAttribute("style");
    var bgRect=document.createElementNS("http://www.w3.org/2000/svg","rect");
    bgRect.setAttribute("width",W);bgRect.setAttribute("height",H);
    bgRect.setAttribute("fill",bg);
    clone.insertBefore(bgRect,clone.firstChild);
    var st=document.createElementNS("http://www.w3.org/2000/svg","style");
    st.textContent="text{font-family:system-ui,-apple-system,sans-serif}";
    clone.insertBefore(st,clone.firstChild);
    var svgData=new XMLSerializer().serializeToString(clone);
    var img=new Image();
    var canvas=document.createElement("canvas");
    canvas.width=W*2;canvas.height=H*2;
    var ctx=canvas.getContext("2d");
    img.onload=function(){
      ctx.drawImage(img,0,0,W*2,H*2);
      var link=document.createElement("a");
      var fname="horangi-leaderboard";
      var activeFamNames=[];
      fams.forEach(function(f){if(f.ms.some(function(m){return activeModels.has(m.n)}))activeFamNames.push(f.name)});
      if(activeFamNames.length>0)fname+="-"+activeFamNames.join("-");
      link.download=fname+".png";
      link.href=canvas.toDataURL("image/png");
      link.click();
    };
    img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svgData);
  };

  var th0={padding:"3px 5px",fontSize:9,color:txt3,fontWeight:500,borderBottom:"1px solid "+borderMed,position:"sticky",top:0,background:bgSec,zIndex:1,whiteSpace:"nowrap"};

  var glpHeaders=GLP_KO.map(function(k,i){return h("th",{key:"gh"+i,style:Object.assign({},th0,{textAlign:"right"})},k)});
  var altHeaders=ALT_KO.map(function(k,i){return h("th",{key:"ah"+i,style:Object.assign({},th0,{textAlign:"right"})},k)});

  return h("div",{style:{maxWidth:1800,margin:"0 auto"}},
    h("div",{style:{marginBottom:8,display:"flex",alignItems:"flex-start",justifyContent:"space-between",flexWrap:"wrap",gap:6}},
      h("div",null,
        h("h2",{style:{margin:"0 0 2px",fontSize:16,fontWeight:600,color:txt}},"Horangi Korean LLM Leaderboard"),
        h("span",{style:{fontSize:11,color:txt3}},DATA.length+" models \u00b7 click points or families to compare \u00b7 updated: "+UPDATED)
      ),
      h("div",{style:{display:"flex",gap:6,alignItems:"center"}},
        h("button",{onClick:function(){setShowReg(!showReg)},
          style:{padding:"3px 10px",borderRadius:6,fontSize:10,cursor:"pointer",
            border:"1px solid "+borderMed,background:showReg?(isDark?"#443020":"#fff4e8"):"transparent",
            color:showReg?(isDark?"#f0a040":"#c06030"):txt2}
        },showReg?"\u2713 Regression":"Regression"),
        h("button",{onClick:function(){setShowRadar(!showRadar)},
          style:{padding:"3px 10px",borderRadius:6,fontSize:10,cursor:"pointer",
            border:"1px solid "+borderMed,background:showRadar?(isDark?"#203040":"#e8f0ff"):"transparent",
            color:showRadar?(isDark?"#60a0e0":"#3060b0"):txt2}
        },showRadar?"\u2713 Radar":"Radar"),
        h("button",{onClick:downloadPng,
          style:{padding:"3px 10px",borderRadius:6,fontSize:10,cursor:"pointer",
            border:"1px solid "+borderMed,background:"transparent",color:txt2}
        },"\u2b07 PNG"),
        h("button",{onClick:downloadCsv,
          style:{padding:"3px 10px",borderRadius:6,fontSize:10,cursor:"pointer",
            border:"1px solid "+borderMed,background:"transparent",color:txt2}
        },"\u2b07 CSV")
      )
    ),
    h("div",{style:{display:"flex",gap:5,flexWrap:"wrap",marginBottom:8}},
      h("button",{onClick:function(){setActiveModels(new Set())},
        style:{padding:"3px 12px",borderRadius:99,fontSize:11,fontWeight:!hasSel?600:400,cursor:"pointer",border:"none",
          background:!hasSel?txt:bgSec,color:!hasSel?bg:txt2}
      },"All"),
      famButtons
    ),
    h("div",{ref:containerRef,style:{display:"flex",alignItems:"stretch",height:"calc(100vh - 110px)",userSelect:dragging.current?"none":"auto"}},
      h("div",{style:{width:splitPct+"%",minWidth:0,overflowX:"auto",overflowY:"auto",borderRadius:8,border:"1px solid "+borderMed}},
        h("table",{style:{borderCollapse:"collapse",fontSize:10,minWidth:900}},
          h("thead",null,
            h("tr",null,
              h("th",{style:Object.assign({},th0,{textAlign:"right"})},"#"),
              h("th",{style:Object.assign({},th0,{textAlign:"left"})},"Model"),
              h("th",{style:Object.assign({},th0,{textAlign:"left"})},"Fam"),
              h("th",{style:Object.assign({},th0,{textAlign:"center"})},""),
              h("th",{style:Object.assign({},th0,{textAlign:"right",color:txt,fontWeight:600})},"FINAL"),
              h("th",{style:Object.assign({},th0,{textAlign:"right",fontWeight:600})},"GLP"),
              h("th",{style:Object.assign({},th0,{textAlign:"right",fontWeight:600})},"ALT"),
              glpHeaders,
              altHeaders
            )
          ),
          h("tbody",null,leaderboardRows)
        )
      ),
      h("div",{
        onPointerDown:onPointerDown,onPointerMove:onPointerMove,onPointerUp:onPointerUp,
        style:{width:8,cursor:"col-resize",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,touchAction:"none"}
      },
        h("div",{style:{width:3,height:40,borderRadius:2,background:borderMed}})
      ),
      h("div",{style:{width:(100-splitPct)+"%",minWidth:0,height:"100%",overflow:"hidden",display:"flex",flexDirection:"column"}},
        h("div",{style:{height:(showRadar&&activeList.length>0)?"58%":"100%",overflow:"hidden",flexShrink:0}},
          h("svg",{ref:function(el){window.__svgEl=el},viewBox:"0 0 "+W+" "+H,
            style:{width:"100%",height:"100%",display:"block"},preserveAspectRatio:"xMidYMid meet"},
            tierPolys,tierLines,xTicks,yTicks,
            h("text",{x:W/2,y:H-2,textAnchor:"middle",fontSize:10,fontWeight:500,fill:axisTxt},"GLP (General Language Proficiency) \u2192"),
            h("text",{x:8,y:H/2,textAnchor:"middle",fontSize:10,fontWeight:500,fill:axisTxt,transform:"rotate(-90,8,"+H/2+")"},"ALT (Alignment) \u2192"),
            showReg&&regression?h("line",{
                x1:sx(xMn),y1:sy(regression.slope*xMn+regression.intercept),
                x2:sx(xMx),y2:sy(regression.slope*xMx+regression.intercept),
                stroke:isDark?"rgba(255,180,80,0.5)":"rgba(200,80,40,0.4)",strokeWidth:1.5,strokeDasharray:"6,4"
            }):null,
            dots,labelEls,tooltip,
            h("g",null,
              h("rect",{x:P.l+4,y:P.t+4,width:82,height:60,rx:5,fill:bg,fillOpacity:0.85,stroke:borderMed,strokeWidth:0.5}),
              [{l:"Frontier",c:"rgba(100,180,100,0.6)"},{l:"Strong",c:"rgba(100,160,220,0.6)"},{l:"Competitive",c:"rgba(210,190,80,0.6)"},{l:"Emerging",c:borderMed}].map(function(t,i){
                return h("g",{key:"tl"+i},
                  h("rect",{x:P.l+10,y:P.t+10+i*13,width:7,height:7,rx:2,fill:t.c}),
                  h("text",{x:P.l+21,y:P.t+17+i*13,fontSize:8.5,fill:txt2},t.l)
                );
              })
            ),
            h("g",null,
              h("rect",{x:W-P.r-64,y:H-P.b-72,width:60,height:72,rx:5,fill:bg,fillOpacity:0.85,stroke:borderMed,strokeWidth:0.5}),
              [{s:"XS",l:"<5B"},{s:"S",l:"5-15B"},{s:"M",l:"15-50B"},{s:"L",l:"50B+"},{s:"API",l:"API"}].map(function(x,i){
                return h("g",{key:"sl"+i},
                  h("circle",{cx:W-P.r-51,cy:H-P.b-59+i*13,r:3.5,fill:SC[x.s],fillOpacity:0.9}),
                  h("text",{x:W-P.r-44,y:H-P.b-56+i*13,fontSize:8.5,fill:txt2},x.l)
                );
              })
            )
          )
        ),
        (showRadar&&activeList.length>0)?h("div",{style:{height:"42%",overflow:"hidden",display:"flex",flexDirection:"column",flexShrink:0}},
          h("div",{style:{flex:"1 1 0",minHeight:0,display:"flex",gap:4}},
            h(RadarChart,{models:activeList,labels:GLP_LABELS,koLabels:GLP_KO,field:"gs",title:"GLP"}),
            h(RadarChart,{models:activeList,labels:ALT_LABELS,koLabels:ALT_KO,field:"as",title:"ALT"})
          ),
          h("div",{style:{flexShrink:0,display:"flex",gap:6,flexWrap:"wrap",alignItems:"center",padding:"2px 0"}},
            activeList.map(function(m,mi){
              var PALETTE=["#e6194b","#3cb44b","#4363d8","#f58231","#911eb4","#42d4f4","#f032e6","#bfef45","#469990","#dcbeff","#9A6324","#800000","#aaffc3","#808000","#000075","#a9a9a9"];
              var lc=activeList.length>1?PALETTE[mi%PALETTE.length]:(FC[m.fam]||"#888");
              return h("div",{key:m.n,style:{display:"flex",alignItems:"center",gap:3,fontSize:10}},
                h("div",{style:{width:8,height:3,borderRadius:1,background:lc}}),
                h("span",{style:{color:txt2}},m.n)
              );
            })
          )
        ):null,
        null
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
